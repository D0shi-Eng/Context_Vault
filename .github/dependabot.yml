version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      development-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
