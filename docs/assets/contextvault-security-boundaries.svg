<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660">
  <rect width="940" height="660" fill="#0d1117"/>
  <text x="470" y="34" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">ContextVault security boundaries</text>
  <text x="470" y="56" font-family="Arial, Segoe UI, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">untrusted input outside, prohibited effects outside, verified containment inside</text>

  <!-- prohibited outer zone -->
  <rect x="24" y="76" width="892" height="120" rx="10" fill="#0d1117" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="44" y="100" font-family="Arial, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#f85149">Absent by design &#8212; prohibited boundaries</text>
  <g font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">
    <text x="60" y="128">network listener</text>
    <line x1="52" y1="134" x2="140" y2="134" stroke="#f85149" stroke-width="1.5"/>
    <text x="200" y="128">durable persistence</text>
    <line x1="192" y1="134" x2="290" y2="134" stroke="#f85149" stroke-width="1.5"/>
    <text x="340" y="128">file writes</text>
    <line x1="332" y1="134" x2="410" y2="134" stroke="#f85149" stroke-width="1.5"/>
    <text x="450" y="128">command execution</text>
    <line x1="442" y1="134" x2="548" y2="134" stroke="#f85149" stroke-width="1.5"/>
    <text x="590" y="128">telemetry / external calls</text>
    <line x1="582" y1="134" x2="720" y2="134" stroke="#f85149" stroke-width="1.5"/>
    <text x="60" y="172">the AI client is never a security boundary: every request is revalidated inside the ContextVault process</text>
  </g>

  <!-- input boundary -->
  <line x1="130" y1="196" x2="130" y2="236" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="130,236 126,229 134,229" fill="#58a6ff"/>
  <text x="140" y="222" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#58a6ff">untrusted, malformed, oversized, injected input</text>

  <!-- input admission layer -->
  <rect x="60" y="236" width="820" height="72" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="470" y="260" font-family="Arial, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">Input admission</text>
  <g font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">
    <text x="110" y="288">strict schema validation (MCP adapter)</text>
    <text x="400" y="288">independent use-case revalidation</text>
    <text x="680" y="288">root ids fixed at startup only</text>
  </g>

  <line x1="470" y1="308" x2="470" y2="332" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="470,332 466,325 474,325" fill="#58a6ff"/>

  <!-- capability + classification layer -->
  <rect x="60" y="332" width="400" height="96" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="260" y="356" font-family="Arial, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">Capability validation</text>
  <g font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">
    <text x="80" y="380">server stores a SHA-256 digest only</text>
    <text x="80" y="396">raw capability token never stored or logged</text>
    <text x="80" y="412">unknown / expired / revoked &#8594; one generic code</text>
  </g>

  <rect x="480" y="332" width="400" height="96" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="680" y="356" font-family="Arial, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">Secret classification</text>
  <g font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">
    <text x="500" y="380">conservative, heuristic content classification</text>
    <text x="500" y="396">confirmed credentials &#8594; prohibited + no grant</text>
    <text x="500" y="412">matched values never returned or logged</text>
  </g>

  <line x1="260" y1="428" x2="260" y2="452" stroke="#58a6ff" stroke-width="2"/>
  <line x1="680" y1="428" x2="680" y2="452" stroke="#58a6ff" stroke-width="2"/>

  <!-- filesystem containment layer -->
  <rect x="60" y="452" width="820" height="120" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="470" y="476" font-family="Arial, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">Authorized workspace root &#8212; filesystem containment</text>
  <g font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">
    <text x="90" y="502">path containment: canonicalization + realpath check</text>
    <text x="90" y="520">symlink / reparse rejection: per-component lstat + O_NOFOLLOW</text>
    <text x="90" y="538">regular files only; links and special files denied</text>
    <text x="540" y="502">bounded reads: 32 MiB default, 64 MiB hard ceiling</text>
    <text x="540" y="520">file identity and stability checked before and after read</text>
    <text x="540" y="538">escaping or changed sources denied with fail-closed codes</text>
  </g>
  <rect x="60" y="552" width="820" height="0" fill="none"/>

  <!-- safe errors strip -->
  <line x1="470" y1="572" x2="470" y2="590" stroke="#d29922" stroke-width="2"/>
  <rect x="60" y="590" width="820" height="46" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="470" y="610" font-family="Arial, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">Safe error boundary</text>
  <text x="470" y="628" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">stable CV_* codes &#183; allowlisted content-free details &#183; correlation id &#183; no paths, source text, secrets, or raw tokens in any output</text>
</svg>
