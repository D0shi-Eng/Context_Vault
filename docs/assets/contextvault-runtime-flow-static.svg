<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
<rect width="800" height="450" fill="#0d1117"/>
<text x="400" y="34" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="bold" fill="#e6edf3" text-anchor="middle">ContextVault runtime flow</text>
<text x="400" y="56" font-family="Arial, Segoe UI, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">MCP over stdio &#183; every call revalidated &#183; fail-closed</text><line x1="164" y1="215" x2="230" y2="152" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="325" y1="180" x2="325" y2="230" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="420" y1="248" x2="510" y2="108" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="420" y1="262" x2="510" y2="198" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="420" y1="276" x2="510" y2="288" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="640" y1="320" x2="640" y2="358" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="325" y1="294" x2="325" y2="358" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="24" y="190" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="94" y="221" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8b949e" text-anchor="middle">MCP client</text>
<text x="94" y="248" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">AI host process</text><rect x="230" y="116" width="190" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="325" y="144" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8b949e" text-anchor="middle">Schema validation</text>
<text x="325" y="168" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">strict input contract</text><rect x="230" y="230" width="190" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="325" y="258" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8b949e" text-anchor="middle">Use-case revalidation</text>
<text x="325" y="282" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">authorization + policies</text><rect x="510" y="76" width="260" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="640" y="104" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8b949e" text-anchor="middle">Authorized file reader</text>
<text x="640" y="128" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">canonical path, bounded read</text><rect x="510" y="166" width="260" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="640" y="194" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8b949e" text-anchor="middle">Capability digest</text>
<text x="640" y="218" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">SHA-256 only, raw token never kept</text><rect x="510" y="256" width="260" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="640" y="284" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8b949e" text-anchor="middle">In-memory vault</text>
<text x="640" y="308" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">TTL, hard ceilings, process memory</text><rect x="510" y="358" width="260" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="640" y="382" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="middle">Structured result</text>
<text x="640" y="402" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">content-free output boundary</text><rect x="230" y="358" width="190" height="56" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
<text x="325" y="382" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="middle">CV_* error envelope</text>
<text x="325" y="402" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">fail-closed, content-free</text><text x="640" y="348" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">success</text><text x="325" y="348" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#f85149" text-anchor="middle">fail-closed</text><text x="400" y="436" font-family="Arial, Segoe UI, sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Tools are independent: the sequence is a recommended client workflow, not internal chaining.</text><g>
<rect x="24" y="330" width="12" height="3" fill="#58a6ff"/>
<text x="42" y="334" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">internal call path</text>
<rect x="24" y="346" width="12" height="3" fill="#3fb950"/>
<text x="42" y="350" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">success outcome</text>
<rect x="24" y="362" width="12" height="3" fill="#f85149"/>
<text x="42" y="366" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">fail-closed outcome</text>
</g>
</svg>