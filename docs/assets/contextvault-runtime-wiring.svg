<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700">
  <rect width="960" height="700" fill="#0d1117"/>
  <text x="480" y="34" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3" text-anchor="middle">ContextVault runtime wiring</text>
  <text x="480" y="56" font-family="Arial, Segoe UI, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">six independent tools &#8212; solid arrows are real internal calls, dashed arrows are the recommended client sequence</text>

  <!-- MCP client -->
  <rect x="24" y="300" width="140" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="94" y="338" font-family="Arial, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#e6edf3" text-anchor="middle">MCP client</text>
  <text x="94" y="358" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">calls any tool,</text>
  <text x="94" y="372" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">in any order</text>

  <!-- six tools -->
  <g font-family="Arial, Segoe UI, sans-serif">
    <rect x="260" y="86" width="220" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="370" y="114" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">contextvault_inspect</text>
    <rect x="260" y="158" width="220" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="370" y="186" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">contextvault_prepare</text>
    <rect x="260" y="230" width="220" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="370" y="258" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">contextvault_retrieve</text>
    <rect x="260" y="302" width="220" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="370" y="330" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">contextvault_verify</text>
    <rect x="260" y="374" width="220" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="370" y="402" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">contextvault_stats</text>
    <rect x="260" y="446" width="220" height="46" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="370" y="474" font-size="13" font-weight="bold" fill="#e6edf3" text-anchor="middle">contextvault_purge</text>
  </g>

  <!-- client fan-out (solid: every tool is independently callable) -->
  <line x1="164" y1="330" x2="260" y2="109" stroke="#58a6ff" stroke-width="1.2"/>
  <line x1="164" y1="334" x2="260" y2="181" stroke="#58a6ff" stroke-width="1.2"/>
  <line x1="164" y1="338" x2="260" y2="253" stroke="#58a6ff" stroke-width="1.2"/>
  <line x1="164" y1="344" x2="260" y2="325" stroke="#58a6ff" stroke-width="1.2"/>
  <line x1="164" y1="350" x2="260" y2="397" stroke="#58a6ff" stroke-width="1.2"/>
  <line x1="164" y1="354" x2="260" y2="469" stroke="#58a6ff" stroke-width="1.2"/>

  <!-- recommended sequence (dashed) -->
  <g stroke="#d29922" stroke-width="1.4" stroke-dasharray="6 4" fill="none">
    <path d="M 246 120 C 200 140 200 160 246 176"/>
    <path d="M 246 192 C 200 212 200 232 246 248"/>
    <path d="M 246 264 C 200 284 200 304 246 320"/>
    <path d="M 246 336 C 200 356 200 376 246 392"/>
    <path d="M 246 408 C 200 428 200 448 246 464"/>
  </g>
  <g font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#d29922">
    <text x="196" y="153" text-anchor="middle">1</text>
    <text x="196" y="225" text-anchor="middle">2</text>
    <text x="196" y="297" text-anchor="middle">3</text>
    <text x="196" y="369" text-anchor="middle">4</text>
    <text x="196" y="441" text-anchor="middle">5</text>
  </g>
  <text x="196" y="500" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">recommended</text>
  <text x="196" y="514" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#d29922" text-anchor="middle">sequence</text>
  <text x="196" y="528" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">(client workflow,</text>
  <text x="196" y="540" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">not internal)</text>

  <!-- shared internal rail -->
  <rect x="560" y="86" width="190" height="406" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <text x="655" y="108" font-family="Arial, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#8b949e" text-anchor="middle">shared internal path</text>
  <text x="655" y="122" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#6e7681" text-anchor="middle">every tool, every call</text>

  <rect x="578" y="138" width="154" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="655" y="160" font-family="Arial, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#e6edf3" text-anchor="middle">Schema validation</text>
  <text x="655" y="176" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">strict input contract</text>

  <rect x="578" y="212" width="154" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="655" y="234" font-family="Arial, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#e6edf3" text-anchor="middle">Use-case revalidation</text>
  <text x="655" y="250" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">authorization + policies</text>

  <rect x="578" y="286" width="154" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="655" y="308" font-family="Arial, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#e6edf3" text-anchor="middle">Reader / vault / crypto</text>
  <text x="655" y="324" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">use-case ports, as needed</text>

  <line x1="655" y1="190" x2="655" y2="212" stroke="#58a6ff" stroke-width="2"/>
  <line x1="655" y1="264" x2="655" y2="286" stroke="#58a6ff" stroke-width="2"/>

  <!-- tools to rail (solid internal calls) -->
  <line x1="480" y1="109" x2="578" y2="156" stroke="#58a6ff" stroke-width="1.4"/>
  <line x1="480" y1="181" x2="578" y2="168" stroke="#58a6ff" stroke-width="1.4"/>
  <line x1="480" y1="253" x2="578" y2="172" stroke="#58a6ff" stroke-width="1.4"/>
  <line x1="480" y1="325" x2="578" y2="176" stroke="#58a6ff" stroke-width="1.4"/>
  <line x1="480" y1="397" x2="578" y2="180" stroke="#58a6ff" stroke-width="1.4"/>
  <line x1="480" y1="469" x2="578" y2="184" stroke="#58a6ff" stroke-width="1.4"/>

  <!-- outcomes -->
  <line x1="655" y1="338" x2="655" y2="520" stroke="#3fb950" stroke-width="2"/>
  <polygon points="655,520 651,513 659,513" fill="#3fb950"/>
  <rect x="560" y="520" width="190" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="655" y="542" font-family="Arial, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#e6edf3" text-anchor="middle">Structured result</text>
  <text x="655" y="558" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">retrieve only: bounded content</text>

  <path d="M 750 196 H 780 V 502 H 370 V 520" fill="none" stroke="#f85149" stroke-width="2"/>
  <polygon points="370,520 366,513 374,513" fill="#f85149"/>
  <rect x="260" y="520" width="220" height="52" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="370" y="542" font-family="Arial, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#e6edf3" text-anchor="middle">CV_* error envelope</text>
  <text x="370" y="558" font-family="Arial, Segoe UI, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">fail-closed &#183; content-free &#183; correlation id</text>

  <!-- legend + notes -->
  <line x1="270" y1="620" x2="310" y2="620" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="318" y="624" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">real internal call</text>
  <line x1="440" y1="620" x2="480" y2="620" stroke="#d29922" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="488" y="624" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">recommended sequence (external workflow)</text>
  <line x1="270" y1="644" x2="310" y2="644" stroke="#3fb950" stroke-width="1.6"/>
  <text x="318" y="648" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">success path</text>
  <line x1="440" y1="644" x2="480" y2="644" stroke="#f85149" stroke-width="1.6"/>
  <text x="488" y="648" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#8b949e">fail-closed path</text>
  <text x="480" y="680" font-family="Arial, Segoe UI, sans-serif" font-size="10" fill="#6e7681" text-anchor="middle">tools never call each other; transient state lives in process memory only and clears on exit</text>
</svg>
